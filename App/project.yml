# Xcode project spec. The checked-in ThermoCalc.xcodeproj is generated from this file:
#   brew install xcodegen && cd App && xcodegen
name: ThermoCalc
options:
  bundleIdPrefix: com.quokecola
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ThermoKit:
    path: ../ThermoKit
targets:
  ThermoCalc:
    type: application
    platform: iOS
    sources:
      - ThermoCalc
    dependencies:
      - package: ThermoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quokecola.ThermoCalc
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ThermoCalc
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
schemes:
  ThermoCalc:
    build:
      targets:
        ThermoCalc: all
    test:
      targets:
        - package: ThermoKit/ThermoKitTests
